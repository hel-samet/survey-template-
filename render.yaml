# Render Blueprint: backend API (data lives in Firebase Firestore).
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: survey-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: CORS_ORIGIN
        value: https://hel-samet.github.io
      - key: TIMEZONE
        value: Asia/Phnom_Penh
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # Firebase project ID for respondent Google sign-in (Firebase console → Project settings)
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
